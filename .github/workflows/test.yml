name: Test Action
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

jobs:
  test:
    name: Run test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: default values
        uses: ./
      - name: specify folder
        uses: ./
        with:
          test_path: ./example
      - name: single file
        uses: ./
        with:
          test_path: ./example/model.fga.yaml
      - name: no matching test files should fail
        id: no_files
        uses: ./
        continue-on-error: true
        with:
          test_path: ./example
          test_files_pattern: '*.no-such-file.yaml'
      - name: assert failure when no test files match
        env:
          NO_FILES_OUTCOME: ${{ steps.no_files.outcome }}
        run: |
          if [ "$NO_FILES_OUTCOME" != "failure" ]; then
            echo "Expected the action to fail when no test files match"
            exit 1
          fi
      - name: test_path starting with - should not be read as a find expression
        id: dash_path
        uses: ./
        continue-on-error: true
        with:
          test_path: '-delete'
      - name: test_path with shell syntax should not be executed
        id: injection_path
        uses: ./
        continue-on-error: true
        with:
          test_path: '$(touch injected-marker)'
      - name: assert malicious test_path values are treated as literal paths
        env:
          DASH_PATH_OUTCOME: ${{ steps.dash_path.outcome }}
          INJECTION_PATH_OUTCOME: ${{ steps.injection_path.outcome }}
        run: |
          if [ "$DASH_PATH_OUTCOME" != "failure" ] || [ "$INJECTION_PATH_OUTCOME" != "failure" ]; then
            echo "Expected the action to fail for non-existent test_path values"
            exit 1
          fi
          if [ ! -f ./example/model.fga.yaml ]; then
            echo "test_path '-delete' was read as a find expression and deleted files"
            exit 1
          fi
          if [ -e ./injected-marker ]; then
            echo "test_path was executed as shell code"
            exit 1
          fi

  test_allow_external_files:
    name: Test allow-external-files flag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: external reference should fail by default
        id: without_flag
        uses: ./
        continue-on-error: true
        with:
          test_path: ./example/allow_external_files/tests
          test_files_pattern: '*.test.yaml'
      - name: assert failure without flag
        env:
          WITHOUT_FLAG_OUTCOME: ${{ steps.without_flag.outcome }}
        run: |
          if [ "$WITHOUT_FLAG_OUTCOME" == "success" ]; then
            echo "Expected the action to fail without fga_cli_allow_external_files"
            exit 1
          fi
      - name: external reference should pass with flag
        uses: ./
        with:
          test_path: ./example/allow_external_files/tests
          test_files_pattern: '*.test.yaml'
          fga_cli_allow_external_files: 'true'

  test_allow_external_files_remote:
    name: Test allow-external-files flag against remote server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: openfga
          POSTGRES_PASSWORD: "1234"
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      OPENFGA_DATASTORE_ENGINE: 'postgres'
      OPENFGA_DATASTORE_URI: 'postgres://openfga:1234@127.0.0.1:5432/openfga'
      OPENFGA_LOG_LEVEL: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install OpenFGA server
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: openfga/openfga
          tag: v1.5.3
          cache: enable
      - name: Migrate OpenFGA Database
        shell: bash
        run: openfga migrate
      - name: Start OpenFGA Server
        shell: bash
        run: openfga run &
      - name: Install OpenFGA cli
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: openfga/cli
          cache: enable
      - name: Install jq
        uses: dcarbone/install-jq-action@4fcb5062d7ce9bc4382d1a352d19ba3ba2c317c1 # v4.0.1
      - name: Create store with model
        id: store
        run: |
          fga store create --model ./example/allow_external_files/model.fga > store_response.json
          cat store_response.json
          store_id=$(jq -r '.store.id' store_response.json)
          echo "store_id=${store_id}" >> $GITHUB_OUTPUT
      - name: remote external reference should by default
        id: without_flag
        uses: ./
        continue-on-error: true
        with:
          test_path: ./example/allow_external_files/tests
          test_files_pattern: '*.test.yaml'
          fga_server_url: 'http://localhost:8080'
          fga_server_store_id: ${{ steps.store.outputs.store_id }}
      - name: assert failure without flag
        env:
          WITHOUT_FLAG_OUTCOME: ${{ steps.without_flag.outcome }}
        run: |
          if [ "$WITHOUT_FLAG_OUTCOME" == "success" ]; then
            echo "Expected the action to fail without fga_cli_allow_external_files"
            exit 1
          fi
      - name: remote external reference should pass with flag
        uses: ./
        with:
          test_path: ./example/allow_external_files/tests
          test_files_pattern: '*.test.yaml'
          fga_cli_allow_external_files: 'true'
          fga_server_url: 'http://localhost:8080'
          fga_server_store_id: ${{ steps.store.outputs.store_id }}

  test_conditions_support:
    name: Test conditions support
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test:
          - openfga_tag: v1.5.3
            conditions_supported: true
          - openfga_tag: v1.4.3
            conditions_supported: true
          - openfga_tag: v1.3.7
            conditions_supported: false
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: openfga
          POSTGRES_PASSWORD: "1234"
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      OPENFGA_DATASTORE_ENGINE: 'postgres'
      OPENFGA_DATASTORE_URI: 'postgres://openfga:1234@127.0.0.1:5432/openfga'
      OPENFGA_LOG_LEVEL: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install OpenFGA server ${{ matrix.test.openfga_tag }}
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: openfga/openfga
          tag: ${{ matrix.test.openfga_tag }}
          cache: enable
      - name: Migrate OpenFGA Database
        shell: bash
        run: openfga migrate
      - name: Start OpenFGA Server
        shell: bash
        run: openfga run &
      - name: Install OpenFGA cli
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: openfga/cli
          cache: enable
      - name: Install jq
        uses: dcarbone/install-jq-action@4fcb5062d7ce9bc4382d1a352d19ba3ba2c317c1 # v4.0.1
      - name: Create store with model
        id: 'store'
        run: |
          fga store create --model ./example/model_with_conditions.fga > store_response.json
          cat store_response.json
          store_id=$(jq -r '.store.id' store_response.json)
          echo "store_id=${store_id}" >> $GITHUB_OUTPUT
      - name: Run OpenFGA CLI Tests
        id: 'tests'
        uses: ./
        continue-on-error: true
        with:
          test_path: ./example/model_with_conditions.fga.yaml
          fga_server_url: 'http://localhost:8080'
          fga_server_store_id: ${{ steps.store.outputs.store_id }}
      - name: Assert expected results
        env:
          CONDITIONS_SUPPORTED: ${{ matrix.test.conditions_supported }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          OPENFGA_TAG: ${{ matrix.test.openfga_tag }}
        run: |
          if [ "$CONDITIONS_SUPPORTED" == "true" ] && [ "$TESTS_OUTCOME" == "failure" ]
          then
            echo "$OPENFGA_TAG is expected to support conditions but tests failed"
            exit 1
          fi
          if [ "$CONDITIONS_SUPPORTED" == "false" ] && [ "$TESTS_OUTCOME" == "success" ]
          then
            echo "$OPENFGA_TAG is expected to not support conditions but tests passed"
            exit 1
          fi

